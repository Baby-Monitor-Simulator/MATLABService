# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run workflow on"
        required: true
        default: "dev"

jobs:
  # -------------------
  # Linting / Static Analysis
  # -------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile project
        run: mvn clean compile

      - name: Run Checkstyle
        id: checkstyle
        run: |
          mvn checkstyle:check || echo "CHECKSTYLE_FAILED=true" >> $GITHUB_ENV
          mvn checkstyle:checkstyle  # Generate report even if check fails
        continue-on-error: true

      - name: Run SpotBugs
        id: spotbugs
        run: |
          mvn spotbugs:check || echo "SPOTBUGS_FAILED=true" >> $GITHUB_ENV
          mvn spotbugs:spotbugs  # Generate report
        continue-on-error: true

      - name: Run PMD
        id: pmd
        run: |
          mvn pmd:check || echo "PMD_FAILED=true" >> $GITHUB_ENV
          mvn pmd:pmd  # Generate report
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Code Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CHECKSTYLE_FAILED" == "true" ]; then
            echo "❌ Checkstyle: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Checkstyle: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$SPOTBUGS_FAILED" == "true" ]; then
            echo "❌ SpotBugs: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ SpotBugs: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PMD_FAILED" == "true" ]; then
            echo "❌ PMD: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ PMD: PASSED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any check failed
        if: env.CHECKSTYLE_FAILED == 'true' || env.SPOTBUGS_FAILED == 'true' || env.PMD_FAILED == 'true'
        run: exit 1

  # -------------------
  # Unit Tests
  # -------------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint # Only run after lint passes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  # -------------------
  # Integration Tests
  # -------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests # Only run after unit tests pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run integration tests
        run: mvn -B verify

  # -------------------
  # Package / Build Artifact
  # -------------------
  build:
    runs-on: ubuntu-latest
    needs: integration-tests # Only run after integration tests pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build package
        run: mvn -B package -DskipTests
