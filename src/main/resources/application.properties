spring.application.name=Simulationplayer
spring.main.allow-bean-definition-overriding=true

# Cloud hosted RabbitMQ setup
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

server.port=${SERVER_PORT:8087}

# MATLAB TCP connection settings
matlab.host=${MATLAB_HOST:matlab-script}
matlab.port=${MATLAB_PORT:12345}
matlab.connection.timeout=${MATLAB_CONNECTION_TIMEOUT:5000}
matlab.read.timeout=${MATLAB_READ_TIMEOUT:10000}